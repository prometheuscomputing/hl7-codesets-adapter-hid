server.max-http-request-header-size=64KB

jwt.secret=jwtSecret
spring.data.mongodb.uri=mongodb://codesets-adapter-db:27017/codeset-adapter
# spring.data.mongodb.uri=mongodb://localhost:27017/codeset-adapter
db.name=codeset-adapter
db.host=codesets-adapter-db
db.port=27017


phinvads.export.dir=./data/phinvads-export
phinvads.export.delay-between-calls-ms=3000
phinvads.export.delay-between-codesets-ms=5000
phinvads.export.page-size=5000
phinvads.export.max-retries=3
phinvads.export.retry-delay-ms=30000
phinvads.export.all-versions=true
# Cap on the number of codesets to process per run (0 = no cap).
phinvads.export.max-codesets=0

# How long PHIN VADS metadata (value set, versions, latest version, code
# systems) is remembered before it is asked for again. Bindings that do not
# pin a version follow a new CDC release after this delay at the latest.
codeset.metadata-cache.ttl-hours=24
# Serialized whole-set responses and the in-memory code index share this TTL.
codeset.response-cache.ttl-hours=6
# Sets loaded at start-up so the first validation after a restart is not
# slow: "oid" or "oid:version", comma separated. These are the sets the
# syndromic and immunization suites bind to.
codeset.warmup.sets=2.16.840.1.114222.4.11.7356,2.16.840.1.114222.4.11.829:6,2.16.840.1.114222.4.11.909
