name: Publish codeset adapter image

# A published release builds the adapter from this repository, runs the unit
# tests, proves the image serves, and pushes it to GHCR. Deployments pin a
# release tag, so what runs is always a build of a tagged commit.
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codeset-adapter
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The CDC vocabulary client is not published anywhere; the jar is kept
      # in the repository and installed into the local Maven repository.
      - name: Install the CDC vocabulary client
        run: |
          mvn -B -q install:install-file -Dfile=external-dependencies/vocab-1.0.jar \
            -DgroupId=gov.cdc -DartifactId=vocab -Dversion=1.0 -Dpackaging=jar

      # ApplicationTests needs a live MongoDB and is covered by the smoke test
      # below; every other test runs.
      - name: Build and test
        run: mvn -B clean package -Dtest='!ApplicationTests' -Dsurefire.failIfNoSpecifiedTests=false

      - name: Stage the jar
        run: cp target/codeset-adapter.jar codeset-adapter.jar

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: codeset-adapter
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ghcr.io/prometheuscomputing/hl7-codesets-adapter-hid:${{ github.event.release.tag_name }}
            ghcr.io/prometheuscomputing/hl7-codesets-adapter-hid:latest

      # "The image was built" is not evidence that it serves. Start it against
      # a MongoDB the way a deployment does and ask it a question.
      - name: Smoke test the image
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/prometheuscomputing/hl7-codesets-adapter-hid:${{ github.event.release.tag_name }}"
          docker network create smoke
          docker run -d --name smoke-mongo --network smoke mongo:7
          docker run -d --name smoke-app --network smoke -p 8080:8080 \
            -e SPRING_DATA_MONGODB_URI=mongodb://smoke-mongo:27017/codeset-adapter \
            -e DB_HOST=smoke-mongo -e DB_PORT=27017 -e DB_NAME=codeset-adapter \
            -e JAVA_OPTS=-Xmx1g "$IMAGE"
          ok=0
          for _ in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:8080/api/v1/providers || true)"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::The adapter did not answer /api/v1/providers. Publishing aborted."
            docker logs smoke-app 2>&1 | tail -200
            exit 1
          fi
          curl -sS http://localhost:8080/api/v1/providers
          echo
          echo "Smoke test passed"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          set -euo pipefail
          docker push "ghcr.io/prometheuscomputing/hl7-codesets-adapter-hid:${{ github.event.release.tag_name }}"
          docker push "ghcr.io/prometheuscomputing/hl7-codesets-adapter-hid:latest"
